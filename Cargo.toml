[workspace]
members = [
  "crates/odp-agent",
  "crates/odp-core",
  "crates/odp-directory",
  "crates/odp-service",
  "examples",
  "tools/odp-conformance",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["Nas Kavian <nas@inflowpay.ai>"]
license = "MIT"
repository = "https://github.com/offering-protocol/odp-rust"
homepage = "https://www.offeringprotocol.org/"
keywords = ["agent", "discovery", "odp", "offering", "protocol"]
categories = ["api-bindings", "web-programming"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
futures = "0.3.34"
getrandom = "0.4.3"
hmac = "0.13.0"
httpdate = "1.0.3"
include_dir = "0.7.4"
jsonschema = { version = "0.52.1", default-features = false }
language-tags = "0.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tiny_http = "0.12.0"
url = "2.5.8"
